<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポップ計算カード DX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* ポップなパステルグラデーションに変更 */
            background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
            color: #333; /* 文字色を濃いグレーに */
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            /* iPhoneのアドレスバー対策：dvhを採用 */
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            /* キャンバス背景を半透明の白にして明るく */
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-grow: 1;
            width: 95%;
        }

        #header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #ff6f61; /* ポップな赤 */
            text-shadow: 2px 2px 0px #fff;
            z-index: 10;
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            font-weight: 900;
            color: #ffca28; /* 黄色 */
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ff6f61;
            pointer-events: none;
            transition: transform 0.1s;
            z-index: 5;
            white-space: nowrap;
        }

        #keypad {
            height: 35vh;
            width: 100%;
            background-color: rgba(255,255,255,0.8); /* 半透明の白 */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .key {
            background-color: #fff;
            border: none;
            border-radius: 15px;
            color: #555;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #ddd; /* 立体感 */
            transition: all 0.1s;
        }

        .key:active {
            transform: translateY(4px); /* 押した沈み込み */
            box-shadow: 0 0 0 #ddd;
        }

        .key-enter {
            background-color: #4facfe; /* 水色 */
            color: #fff;
            box-shadow: 0 4px 0 #0072ff;
        }
        .key-enter[data-val="DEL"] {
            background-color: #ff6f61; /* 赤 */
            box-shadow: 0 4px 0 #d93d3d;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95); /* 白っぽく */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff6f61;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffd700;
            text-align: center;
        }

        p { font-size: 16px; color: #666; margin-bottom: 20px; text-align: center; font-weight: bold; }

        .btn {
            padding: 15px 40px;
            margin: 8px;
            font-size: 20px;
            font-weight: bold;
            background: #ff9a9e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.4);
            width: 220px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-mode {
            background: #4facfe;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        /* 鬼モードボタン */
        .btn-oni {
            background: linear-gradient(45deg, #85FFBD 0%, #FFFB7D 100%);
            background: #333;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .hidden { display: none !important; }

        #input-buffer {
            position: absolute;
            bottom: 37vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 5px 30px;
            border-radius: 50px;
            border: 3px solid #4facfe;
            min-width: 80px;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div id="score">Score: 0</div>
        <div id="life">HP: ❤️❤️❤️❤️❤️</div>
    </div>

    <div id="combo-display"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="input-buffer"></div>

    <div id="keypad">
        <div class="key" data-val="7">7</div>
        <div class="key" data-val="8">8</div>
        <div class="key" data-val="9">9</div>
        <div class="key" data-val="4">4</div>
        <div class="key" data-val="5">5</div>
        <div class="key" data-val="6">6</div>
        <div class="key" data-val="1">1</div>
        <div class="key" data-val="2">2</div>
        <div class="key" data-val="3">3</div>
        <div class="key" data-val="0">0</div>
        <div class="key key-enter" data-val="DEL">けす</div>
        <div class="key key-enter" data-val="OK">決定</div>
    </div>

    <div id="menu-overlay">
        <div id="title-screen">
            <h1>🌈 ポップ計算カード</h1>
            <p>モードをえらんでスタート！</p>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <button class="btn btn-mode" onclick="selectMode('add')">たしざん (+)</button>
                <button class="btn btn-mode" onclick="selectMode('sub')">ひきざん (-)</button>
                <button class="btn btn-mode" onclick="selectMode('kuku')">九九 (×)</button>
            </div>
        </div>

        <div id="difficulty-buttons" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
            <h1>レベルをえらぼう</h1>
            <p>むずかしさをえらんでね</p>
            <button class="btn" onclick="startGame('easy')">かんたん</button>
            <button class="btn" onclick="startGame('normal')">ふつう</button>
            <button class="btn" onclick="startGame('hard')">むずかしい</button>
            <button class="btn btn-oni" onclick="startGame('oni')">👹 おにむず 👹</button>
        </div>
    </div>
</div>

<script>
/* -----------------------
   グローバル変数
------------------------ */
let selectedMode = "add";

function selectMode(mode) {
    selectedMode = mode;
    document.getElementById("title-screen").classList.add("hidden");
    document.getElementById("difficulty-buttons").classList.remove("hidden");
}

/* -----------------------
   Audio (BGMランダム再生機能付き)
------------------------ */
const Audio = (function() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmTimer = null;
    let tempo = 120;
    let currentMelodyIndex = 0; // 現在の曲

    // 音階データ
    const notes = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'C6': 1046.50
    };

    // 5種類のメロディパターン (16ステップ)
    const melodies = [
        // 1. スタンダード (ドミソ)
        ['C5','','E5','','G5','','C6','', 'A5','','G5','','E5','','C5',''],
        // 2. 階段 (ドレミファ)
        ['C5','D5','E5','F5','G5','A5','B5','C6', 'G5','','E5','','C5','','',''],
        // 3. スキップ (ド・ド・ソ・ソ)
        ['C5','C5','G5','G5','A5','A5','G5','', 'F5','F5','E5','E5','D5','D5','C5',''],
        // 4. アルペジオ (分散和音)
        ['C5','E5','G5','C6','E5','G5','C6','E6', 'D6','B5','G5','F5','D5','B4','G4',''],
        // 5. マイナー風 (ちょっとかっこよく)
        ['A4','','C5','','E5','','A5','', 'G5','F5','E5','D5','C5','B4','A4','']
    ];

    function playTone(freq, type, duration, vol) {
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
    }

    function playDrum() {
        const bufferSize = ctx.sampleRate * 0.1;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.05;
        noise.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
    }

    let tick = 0;

    function pickRandomBGM() {
        currentMelodyIndex = Math.floor(Math.random() * melodies.length);
    }

    function startBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        tick = 0;
        
        bgmTimer = setInterval(() => {
            if (ctx.state === 'suspended') ctx.resume();

            // リズム（ドラムとベース）
            if (tick % 4 === 0) {
                playTone(220, 'triangle', 0.15, 0.1); // ベース
                playDrum();
            }
            if (tick % 2 === 0) playDrum();

            // メロディ再生
            const currentMelody = melodies[currentMelodyIndex];
            const noteName = currentMelody[tick % 16];
            
            if (noteName && notes[noteName]) {
                // サイン波で可愛く
                playTone(notes[noteName], 'sine', 0.2, 0.1); 
            }

            tick++;
        }, (60 / tempo) / 4 * 1000);
    }

    function stopBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
    }

    function setTempo(newTempo) {
        if (Math.abs(tempo - newTempo) > 5) {
            tempo = newTempo;
            startBGM(); // テンポ変更時は再起動
        }
    }

    function playSE(type) {
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
            osc.type = 'triangle'; // キラキラ感アップ
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        } else if (type === 'tap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        }
        osc.start(now);
        osc.stop(now + 0.3);
    }

    return {
        pickRandomBGM, startBGM, stopBGM, setTempo, playSE,
        resume: () => { if (ctx.state === 'suspended') ctx.resume(); }
    };
})();

/* -----------------------
   ゲームロジック
------------------------ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let lastTime = 0;
let spawnTimer = 0;
let spawnInterval = 2500;
let notes = [];
let particles = [];
let score = 0;
let hp = 5;
let combo = 0;
let mode = 'add';
let inputBuffer = "";
let gameActive = false;
let speed = 100;
let baseBPM = 110;

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// 明るい色パレット
const POP_COLORS = ['#FF9A9E', '#FECFEF', '#a1c4fd', '#c2e9fb', '#fbc2eb', '#a6c1ee', '#fdcbf1', '#e6dee9'];

class Note {
    constructor(mode) {
        this.x = Math.random() * (canvas.width - 100) + 50;
        this.y = -60;
        this.r = 35; // 少し大きく
        // ランダムなパステルカラー
        this.color = POP_COLORS[Math.floor(Math.random() * POP_COLORS.length)];
        
        if (mode === 'add') {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            this.text = `${a} + ${b}`;
            this.answer = a + b;
        } else if (mode === 'sub') {
            const a = Math.floor(Math.random() * 10) + 5;
            const b = Math.floor(Math.random() * (a - 1)) + 1;
            this.text = `${a} - ${b}`;
            this.answer = a - b;
        } else if (mode === 'kuku') {
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            this.text = `${a} × ${b}`;
            this.answer = a * b;
        }
    }

    update(dt) {
        this.y += speed * dt;
    }

    draw(ctx) {
        // ポップな丸（塗りつぶし）
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff'; // 白い縁取り
        ctx.stroke();

        // 文字
        ctx.fillStyle = '#555'; // 濃いグレーで読みやすく
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.x, this.y);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 10 + 5;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt * 2;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // 四角い紙吹雪風
        ctx.rect(this.x, this.y, this.size, this.size);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function startGame(difficulty) {
    Audio.resume();
    Audio.pickRandomBGM(); // ランダム選曲

    mode = selectedMode;
    score = 0;
    hp = 5;
    combo = 0;
    notes = [];
    particles = [];
    inputBuffer = "";
    gameActive = true;

    /* ▼ 難易度設定 */
    if (difficulty === "easy") {
        speed = canvas.height / 10;
        spawnInterval = 3500;
        baseBPM = 100;
    } else if (
