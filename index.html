<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポップ計算カード DX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
            color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-grow: 1;
            width: 95%;
        }

        #header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #ff6f61;
            text-shadow: 2px 2px 0px #fff;
            z-index: 10;
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            font-weight: 900;
            color: #ffca28;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ff6f61;
            pointer-events: none;
            transition: transform 0.1s;
            z-index: 5;
            white-space: nowrap;
        }

        #keypad {
            height: 35vh;
            width: 100%;
            background-color: rgba(255,255,255,0.8);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .key {
            background-color: #fff;
            border: none;
            border-radius: 15px;
            color: #555;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #ddd;
            transition: all 0.1s;
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .key-enter {
            background-color: #4facfe;
            color: #fff;
            box-shadow: 0 4px 0 #0072ff;
        }
        .key-enter[data-val="DEL"] {
            background-color: #ff6f61;
            box-shadow: 0 4px 0 #d93d3d;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            overflow-y: auto;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff6f61;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffd700;
            text-align: center;
        }

        p { font-size: 16px; color: #666; margin-bottom: 20px; text-align: center; font-weight: bold; }

        .btn {
            padding: 15px 40px;
            margin: 8px;
            font-size: 20px;
            font-weight: bold;
            background: #ff9a9e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.4);
            width: 220px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-mode {
            background: #4facfe;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-oni {
            background: linear-gradient(45deg, #85FFBD 0%, #FFFB7D 100%);
            background: #333;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .hidden { display: none !important; }

        #input-buffer {
            position: absolute;
            bottom: 37vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 5px 30px;
            border-radius: 50px;
            border: 3px solid #4facfe;
            min-width: 80px;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* ランキング表示用 */
        #ranking-container {
            margin-top: 20px; /* 上部の隙間を少し広げた */
            background: rgba(255,255,255,0.8);
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #ffca28;
            width: 80%;
            max-width: 300px;
            text-align: center;
            /* 中央寄せを強化 */
            margin-left: auto;
            margin-right: auto;
        }
        .rank-item {
            font-size: 18px;
            margin: 5px 0;
            color: #555;
            border-bottom: 1px dashed #ccc;
        }
        .rank-1 { color: #ff6f61; font-weight: bold; font-size: 22px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div id="score">Score: 0</div>
        <div id="life">HP: ❤️❤️❤️❤️❤️</div>
    </div>

    <div id="combo-display"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="input-buffer"></div>

    <div id="keypad">
        <div class="key" data-val="7">7</div>
        <div class="key" data-val="8">8</div>
        <div class="key" data-val="9">9</div>
        <div class="key" data-val="4">4</div>
        <div class="key" data-val="5">5</div>
        <div class="key" data-val="6">6</div>
        <div class="key" data-val="1">1</div>
        <div class="key" data-val="2">2</div>
        <div class="key" data-val="3">3</div>
        <div class="key" data-val="0">0</div>
        <div class="key key-enter" data-val="DEL">けす</div>
        <div class="key key-enter" data-val="OK">決定</div>
    </div>

    <div id="menu-overlay">
        <div id="title-screen">
            <h1>🌈 ポップ計算カード</h1>
            <p>モードをえらんでスタート！</p>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <button class="btn btn-mode" onclick="selectMode('add')">たしざん (+)</button>
                <button class="btn btn-mode" onclick="selectMode('sub')">ひきざん (-)</button>
                <button class="btn btn-mode" onclick="selectMode('kuku')">かけざん (×)</button>
            </div>
            <div id="ranking-container">
                <div>🏆 ベストスコア 🏆</div>
                <div id="ranking-list"></div>
            </div>
        </div>

        <div id="difficulty-buttons" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
            <h1>レベルをえらぼう</h1>
            <p>むずかしさをえらんでね</p>
            <button class="btn" onclick="startGame('easy')">かんたん</button>
            <button class="btn" onclick="startGame('normal')">ふつう</button>
            <button class="btn" onclick="startGame('hard')">むずかしい</button>
            <button class="btn btn-oni" onclick="startGame('oni')">👹 おにむず 👹</button>
        </div>
    </div>
</div>

<script>
window.onerror = function(msg, url, line) {
    alert("エラーが発生しました: " + msg + "\n行: " + line);
};

/* -----------------------
   グローバル変数
------------------------ */
let selectedMode = "add";
let difficultyLevel = 'normal';

let score = 0;
let hp = 5;
let combo = 0;
let mode = 'add';
let inputBuffer = "";
let gameActive = false;
let speed = 100;
let baseBPM = 110;
let spawnInterval = 2500;
let lastTime = 0;
let spawnTimer = 0;
let notes = [];
let particles = [];
let questionCount = 0;
const POP_COLORS = ['#FF9A9E', '#FECFEF', '#a1c4fd', '#c2e9fb', '#fbc2eb', '#a6c1ee', '#fdcbf1', '#e6dee9'];

/* -----------------------
   ランキング管理
------------------------ */
function saveScore(newScore) {
    const KEY = 'popCalcScores_' + selectedMode;
    let scores = [];
    try {
        scores = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch(e) {}
    
    scores.push(newScore);
    scores.sort((a, b) => b - a);
    scores = scores.slice(0, 5);
    
    localStorage.setItem(KEY, JSON.stringify(scores));
    updateRankingDisplay();
}

function updateRankingDisplay() {
    const KEY = 'popCalcScores_' + selectedMode;
    let scores = [];
    try {
        scores = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch(e) {}

    const listEl = document.getElementById('ranking-list');
    listEl.innerHTML = "";
    if (scores.length === 0) {
        listEl.innerHTML = "<div style='color:#999; font-size:14px;'>まだきろくがないよ</div>";
    } else {
        scores.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = `rank-item rank-${i+1}`;
            // 修正箇所: 順位表記を「い」から「位」へ
            div.textContent = `${i+1}位: ${s}点`;
            listEl.appendChild(div);
        });
    }
}

function selectMode(modeName) {
    selectedMode = modeName;
    updateRankingDisplay();
    document.getElementById("title-screen").classList.add("hidden");
    document.getElementById("difficulty-buttons").classList.remove("hidden");
}

/* -----------------------
   GameAudio
------------------------ */
const GameAudio = (function() {
    let ctx = null;
    let bgmTimer = null;
    let tempo = 120;
    let currentSongIndex = 0;

    const notes = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'C6': 1046.50
    };

    const songs = [
        { name: "Standard", tone: "sine", bass: "triangle", melody: ['C5','','E5','','G5','','C6','', 'A5','','G5','','E5','','C5',''] },
        { name: "8-bit", tone: "square", bass: "sawtooth", melody: ['C5','D5','E5','F5','G5','A5','B5','C6', 'G5','','E5','','C5','','',''] },
        { name: "Crystal", tone: "triangle", bass: "sine", melody: ['C5','C5','G5','G5','A5','A5','G5','', 'F5','F5','E5','E5','D5','D5','C5',''] },
        { name: "Energetic", tone: "sawtooth", bass: "square", melody: ['C5','E5','G5','C6','E5','G5','C6','E6', 'D6','B5','G5','F5','D5','B4','G4',''] },
        { name: "Minor", tone: "sine", bass: "triangle", melody: ['A4','','C5','','E5','','A5','', 'G5','F5','E5','D5','C5','B4','A4',''] }
    ];

    function init() {
        if (!ctx) {
            try {
                ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) { console.error(e); }
        }
    }

    function playTone(freq, type, duration, vol) {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
    }

    function playDrum() {
        if (!ctx) return;
        const bufferSize = ctx.sampleRate * 0.1;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.05;
        noise.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
    }

    function pickRandomBGM() {
        currentSongIndex = Math.floor(Math.random() * songs.length);
    }

    function startBGM() {
        init();
        if (bgmTimer) clearInterval(bgmTimer);
        let tick = 0;
        bgmTimer = setInterval(() => {
            if (ctx && ctx.state === 'suspended') ctx.resume();
            const song = songs[currentSongIndex];
            if (tick % 4 === 0) {
                playTone(220, song.bass, 0.15, 0.1); 
                playDrum();
            }
            if (tick % 2 === 0) playDrum();
            const noteName = song.melody[tick % 16];
            if (noteName && notes[noteName]) {
                playTone(notes[noteName], song.tone, 0.2, 0.1); 
            }
            tick++;
        }, (60 / tempo) / 4 * 1000);
    }

    function stopBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
    }

    function setTempo(newTempo) {
        if (Math.abs(tempo - newTempo) > 2) {
            tempo = newTempo;
            startBGM(); 
        }
    }

    function playSE(type) {
        init();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(1200, now);
            osc.frequency.linearRampToValueAtTime(1800, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        } else if (type === 'tap') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        }
        osc.start(now);
        osc.stop(now + 0.3);
    }

    return { pickRandomBGM, startBGM, stopBGM, setTempo, playSE, resume: () => { if (ctx && ctx.state === 'suspended') ctx.resume(); } };
})();

/* -----------------------
   ゲームロジック
------------------------ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

class Note {
    constructor(mode) {
        this.x = Math.random() * (canvas.width - 100) + 50;
        this.y = -60;
        this.r = 35; 
        this.color = POP_COLORS[Math.floor(Math.random() * POP_COLORS.length)];
        
        // ▼▼▼ 出題数に応じた2桁確率の調整 ▼▼▼
        questionCount++; 
        
        let useTwoDigit = false;
        
        if (questionCount <= 4) {
            useTwoDigit = false;
        } else if (questionCount <= 10) {
            if (Math.random() < 0.35) useTwoDigit = true;
        } else if (questionCount <= 20) {
            if (Math.random() < 0.4) useTwoDigit = true;
        } else {
            if (Math.random() < 0.5) useTwoDigit = true;
        }

        let minNum = 1;
        let maxNum = 9;

        if (useTwoDigit) {
            minNum = 10;
            maxNum = 20;
            
            if (difficultyLevel === 'hard') maxNum = 50;
            if (difficultyLevel === 'oni') maxNum = 99;
        } else {
            maxNum = 9;
        }

        if (mode === 'add') {
            const a = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            const b = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum;
            this.text = `${a} + ${b}`;
            this.answer = a + b;
        } else if (mode === 'sub') {
            const a = Math.floor(Math.random() * (maxNum - minNum + 1)) + minNum + 5;
            const b = Math.floor(Math.random() * (a - 1)) + 1;
            this.text = `${a} - ${b}`;
            this.answer = a - b;
        } else if (mode === 'kuku') {
            let kukuMax = 9;
            if (useTwoDigit && difficultyLevel === 'oni') kukuMax = 19;
            
            const a = Math.floor(Math.random() * kukuMax) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            this.text = `${a} × ${b}`;
            this.answer = a * b;
        }
    }

    update(dt) {
        this.y += speed * dt;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff'; 
        ctx.stroke();

        ctx.fillStyle = '#555'; 
        ctx.font = 'bold 26px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, this.x, this.y);
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 10 + 5;
    }
    update(dt) {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= dt * 2;
        this.size *= 0.95;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.rect(this.x, this.y, this.size, this.size);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
}

function startGame(difficulty) {
    try {
        GameAudio.resume();
        GameAudio.pickRandomBGM(); 
    } catch(e) {}

    difficultyLevel = difficulty;
    mode = selectedMode;
    score = 0;
    hp = 5;
    combo = 0;
    questionCount = 0;
    notes = [];
    particles = [];
    inputBuffer = "";
    gameActive = true;

    if (difficulty === "easy") {
        speed = canvas.height / 10;
        spawnInterval = 3500;
        baseBPM = 100;
    } else if (difficulty === "normal") {
        speed = canvas.height / 7;
        spawnInterval = 2500;
        baseBPM = 120;
    } else if (difficulty === "hard") {
        speed = canvas.height / 4;
        spawnInterval = 1800;
        baseBPM = 140;
    } else if (difficulty === "oni") {
        speed = canvas.height / 1.5;
        spawnInterval = 1200;
        baseBPM = 180;
    }

    GameAudio.setTempo(baseBPM);
    GameAudio.startBGM();

    document.getElementById('menu-overlay').classList.add('hidden');
    updateUI();
    
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameActive = false;
    GameAudio.stopBGM();
    saveScore(score);

    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('title-screen').classList.remove('hidden');
    document.getElementById('difficulty-buttons').classList.add('hidden');
    document.querySelector('#title-screen h1').textContent = `Game Over! Score: ${score}`;
    document.querySelector('#title-screen p').textContent = "もういちど あそぶ？";
}

function updateUI() {
    document.getElementById('score').textContent = `Score: ${score}`;
    let hearts = "";
    for(let i=0; i<hp; i++) hearts += "❤️";
    document.getElementById('life').textContent = `HP: ${hearts}`;
    document.getElementById('input-buffer').textContent = inputBuffer;
    
    const comboEl = document.getElementById('combo-display');
    if (combo > 1) {
        comboEl.textContent = `${combo} COMBO!`;
        comboEl.style.opacity = 1;
        comboEl.style.transform = "translateX(-50%) scale(1.3) rotate(-5deg)";
        setTimeout(() => {
             comboEl.style.transform = "translateX(-50%) scale(1) rotate(0deg)";
        }, 100);
    } else {
        comboEl.textContent = "";
    }
}

function checkAnswer() {
    const val = parseInt(inputBuffer);
    if (isNaN(val)) return;

    let hitIndex = -1;
    let lowestY = -1000;

    for (let i = 0; i < notes.length; i++) {
        if (notes[i].answer === val && notes[i].y > 0 && notes[i].y > lowestY) {
            lowestY = notes[i].y;
            hitIndex = i;
        }
    }

    if (hitIndex !== -1) {
        GameAudio.playSE('correct');
        const note = notes[hitIndex];
        for(let p=0; p<20; p++) {
             particles.push(new Particle(note.x, note.y, POP_COLORS[Math.floor(Math.random()*POP_COLORS.length)]));
        }

        score += 100 + (combo * 10);
        combo++;
        notes.splice(hitIndex, 1);
        inputBuffer = "";

        let speedIncrement = 5; 
        if(difficultyLevel === 'oni') speedIncrement = 10;
        speed += speedIncrement;

        spawnInterval = Math.max(500, spawnInterval - 15); 

        let bpmIncrease = Math.floor(score / 100); 
        let newBPM = Math.min(240, baseBPM + bpmIncrease);
        GameAudio.setTempo(newBPM);
    }
    updateUI();
}

document.querySelectorAll('.key').forEach(key => {
    const handleInput = (e) => {
        e.preventDefault();
        if (!gameActive) return;

        const val = key.getAttribute('data-val');
        GameAudio.playSE('tap');

        if (val === 'DEL') {
            inputBuffer = "";
        } else if (val === 'OK') {
            const answerVal = parseInt(inputBuffer);
            let hit = notes.some(n => n.answer === answerVal && n.y > 0);
            if (hit) {
                checkAnswer();
            } else {
                if (inputBuffer !== "") {
                    GameAudio.playSE('wrong');
                    combo = 0;
                    inputBuffer = "";
                    hp--;
                    if (hp <= 0) gameOver();
                }
            }
        } else {
            if (inputBuffer.length < 3) inputBuffer += val;
        }
        updateUI();
    };
    key.addEventListener('touchstart', handleInput);
    key.addEventListener('mousedown', handleInput);
});

function gameLoop(timestamp) {
    if (!gameActive) return;
    const dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.beginPath();
    ctx.moveTo(0, canvas.height - 60);
    ctx.lineTo(canvas.width, canvas.height - 60);
    ctx.strokeStyle = 'rgba(255, 111, 97, 0.5)';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 10]);
    ctx.stroke();
    ctx.setLineDash([]);

    spawnTimer += dt * 1000;
    if (spawnTimer > spawnInterval) {
        notes.push(new Note(mode));
        spawnTimer = 0;
    }

    for (let i = notes.length - 1; i >= 0; i--) {
        let note = notes[i];
        note.update(dt);
        note.draw(ctx);

        if (note.y > canvas.height) {
            notes.splice(i, 1);
            combo = 0;
            hp--;
            GameAudio.playSE('wrong');
            updateUI();
            if (hp <= 0) {
                gameOver();
                return;
            }
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        particles[i].draw(ctx);
        if (particles[i].life <= 0) particles.splice(i, 1);
    }
    requestAnimationFrame(gameLoop);
}

// 初期化（ランキング読み込み）
updateRankingDisplay();
</script>
