<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポップ計算カード DX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
            color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-grow: 1;
            width: 95%;
        }

        #header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #ff6f61;
            text-shadow: 2px 2px 0px #fff;
            z-index: 10;
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            font-weight: 900;
            color: #ffca28;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ff6f61;
            pointer-events: none;
            transition: transform 0.1s;
            z-index: 5;
            white-space: nowrap;
        }

        #keypad {
            height: 35vh;
            width: 100%;
            background-color: rgba(255,255,255,0.8);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .key {
            background-color: #fff;
            border: none;
            border-radius: 15px;
            color: #555;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #ddd;
            transition: all 0.1s;
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .key-enter {
            background-color: #4facfe;
            color: #fff;
            box-shadow: 0 4px 0 #0072ff;
        }
        .key-enter[data-val="DEL"] {
            background-color: #ff6f61;
            box-shadow: 0 4px 0 #d93d3d;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff6f61;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffd700;
            text-align: center;
        }

        p { font-size: 16px; color: #666; margin-bottom: 20px; text-align: center; font-weight: bold; }

        .btn {
            padding: 15px 40px;
            margin: 8px;
            font-size: 20px;
            font-weight: bold;
            background: #ff9a9e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.4);
            width: 220px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-mode {
            background: #4facfe;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-oni {
            background: linear-gradient(45deg, #85FFBD 0%, #FFFB7D 100%);
            background: #333;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .hidden { display: none !important; }

        #input-buffer {
            position: absolute;
            bottom: 37vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: bold;
            color: #333;
            background: rgba(255,255,255,0.9);
            padding: 5px 30px;
            border-radius: 50px;
            border: 3px solid #4facfe;
            min-width: 80px;
            text-align: center;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div id="score">Score: 0</div>
        <div id="life">HP: ❤️❤️❤️❤️❤️</div>
    </div>

    <div id="combo-display"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="input-buffer"></div>

    <div id="keypad">
        <div class="key" data-val="7">7</div>
        <div class="key" data-val="8">8</div>
        <div class="key" data-val="9">9</div>
        <div class="key" data-val="4">4</div>
        <div class="key" data-val="5">5</div>
        <div class="key" data-val="6">6</div>
        <div class="key" data-val="1">1</div>
        <div class="key" data-val="2">2</div>
        <div class="key" data-val="3">3</div>
        <div class="key" data-val="0">0</div>
        <div class="key key-enter" data-val="DEL">けす</div>
        <div class="key key-enter" data-val="OK">決定</div>
    </div>

    <div id="menu-overlay">
        <div id="title-screen">
            <h1>🌈 ポップ計算カード</h1>
            <p>モードをえらんでスタート！</p>
            <div style="display:flex; flex-direction:column; align-items:center;">
                <button class="btn btn-mode" onclick="selectMode('add')">たしざん (+)</button>
                <button class="btn btn-mode" onclick="selectMode('sub')">ひきざん (-)</button>
                <button class="btn btn-mode" onclick="selectMode('kuku')">九九 (×)</button>
            </div>
        </div>

        <div id="difficulty-buttons" class="hidden" style="display:flex; flex-direction:column; align-items:center;">
            <h1>レベルをえらぼう</h1>
            <p>むずかしさをえらんでね</p>
            <button class="btn" onclick="startGame('easy')">かんたん</button>
            <button class="btn" onclick="startGame('normal')">ふつう</button>
            <button class="btn" onclick="startGame('hard')">むずかしい</button>
            <button class="btn btn-oni" onclick="startGame('oni')">👹 おにむず 👹</button>
        </div>
    </div>
</div>

<script>
/* -----------------------
   グローバル変数
------------------------ */
let selectedMode = "add";

function selectMode(mode) {
    selectedMode = mode;
    document.getElementById("title-screen").classList.add("hidden");
    document.getElementById("difficulty-buttons").classList.remove("hidden");
}

/* -----------------------
   GameAudio (楽器機能追加版)
------------------------ */
const GameAudio = (function() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmTimer = null;
    let tempo = 120;
    let currentSongIndex = 0;

    const notes = {
        'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00, 'A4': 440.00, 'B4': 493.88,
        'C5': 523.25, 'D5': 587.33, 'E5': 659.25, 'F5': 698.46, 'G5': 783.99, 'A5': 880.00, 'B5': 987.77, 'C6': 1046.50
    };

    // 曲データ：メロディだけでなく、楽器の音色(tone)とベースの音色(bass)を定義
    const songs = [
        {
            name: "Standard",
            tone: "sine", // 丸い音
            bass: "triangle",
            melody: ['C5','','E5','','G5','','C6','', 'A5','','G5','','E5','','C5','']
        },
        {
            name: "8-bit",
            tone: "square", // ファミコン風
            bass: "sawtooth",
            melody: ['C5','D5','E5','F5','G5','A5','B5','C6', 'G5','','E5','','C5','','','']
        },
        {
            name: "Crystal",
            tone: "triangle", // キラキラ風
            bass: "sine",
            melody: ['C5','C5','G5','G5','A5','A5','G5','', 'F5','F5','E5','E5','D5','D5','C5','']
        },
        {
            name: "Energetic",
            tone: "sawtooth", // 鋭い音
            bass: "square",
            melody: ['C5','E5','G5','C6','E5','G5','C6','E6', 'D6','B5','G5','F5','D5','B4','G4','']
        },
        {
            name: "Minor",
            tone: "sine",
            bass: "triangle",
            melody: ['A4','','C5','','E5','','A5','', 'G5','F5','E5','D5','C5','B4','A4','']
        }
    ];

    function playTone(freq, type, duration, vol) {
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.stop(ctx.currentTime + duration);
    }

    function playDrum() {
        const bufferSize = ctx.sampleRate * 0.1;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.value = 0.05;
        noise.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
    }

    let tick = 0;

    function pickRandomBGM() {
        currentSongIndex = Math.floor(Math.random() * songs.length);
    }

    function startBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        tick = 0;
