<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ポップ計算カード DX</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #ffecd2 0%, #fcb69f 100%);
            color: #333;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            flex-grow: 1;
            width: 95%;
        }

        #header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #ff6f61;
            text-shadow: 2px 2px 0px #fff;
            z-index: 10;
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 50px;
            font-weight: 900;
            color: #ffca28;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ff6f61;
            pointer-events: none;
            transition: transform 0.1s;
            z-index: 5;
            white-space: nowrap;
        }

        #keypad {
            height: 35vh;
            width: 100%;
            background-color: rgba(255,255,255,0.8);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px;
            box-sizing: border-box;
            z-index: 20;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .key {
            background-color: #fff;
            border: none;
            border-radius: 15px;
            color: #555;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 0 #ddd;
            transition: all 0.1s;
        }

        .key:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .key-enter {
            background-color: #4facfe;
            color: #fff;
            box-shadow: 0 4px 0 #0072ff;
        }
        .key-enter[data-val="DEL"] {
            background-color: #ff6f61;
            box-shadow: 0 4px 0 #d93d3d;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        h1 {
            margin-bottom: 10px;
            color: #ff6f61;
            font-size: 32px;
            text-shadow: 2px 2px 0px #ffd700;
            text-align: center;
        }

        p { font-size: 16px; color: #666; margin-bottom: 20px; text-align: center; font-weight: bold; }

        .btn {
            padding: 15px 40px;
            margin: 8px;
            font-size: 20px;
            font-weight: bold;
            background: #ff9a9e;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 111, 97, 0.4);
            width: 220px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }

        .btn-mode {
            background: #4facfe;
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-oni {
            background: linear-gradient(45deg, #85FFBD 0%, #FFFB7D 100%);
            background: #333;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px #ff0055;
        }

        .hidden { display: none !important; }

            bottom: 37vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: bold;
